name: CI

# Checks every pull request and push to main. Releases (nightly on every green push to main,
# stable from a version tag) are built by release.yml.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      signed_windows:
        description: Build a signed Windows verification package without publishing a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, test and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      package_required: ${{ steps.changes.outputs.package_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch pull request tips for change detection
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"

      - name: Detect installer changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/scripts/ci-packaging.mjs

      - name: Test installer change detection
        run: node --test .github/scripts/ci-packaging.test.mjs

      - name: Test the Microsoft Store upload script
        run: node --test .github/scripts/store-blob.test.mjs

      - name: Test the Homebrew cask script
        run: node --test .github/scripts/homebrew-cask.test.mjs

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        if: github.event_name == 'pull_request'
        run: npm test

      - name: Unit tests with coverage
        if: github.event_name != 'pull_request'
        run: npm run test:coverage

      - name: Upload coverage
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Build
        run: npm run build

      - name: Smoke test
        timeout-minutes: 5
        run: xvfb-run -a npm run smoke -- out/smoke

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-screenshots-linux
          path: out/smoke
          if-no-files-found: ignore

      # A complete first sign-in in every browser engine, in the packaged Linux app, against a
      # local stand-in for login.microsoftonline.com and the licensing service that the runner's
      # hosts file and trust store point to (scripts/sign-in-e2e).
      - name: Package the Linux app
        run: npx electron-builder --config electron-builder.config.cjs --linux dir --publish never

      - name: Install the sign-in test
        run: |
          npm ci --prefix scripts/sign-in-e2e
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3-tools gnome-keyring libsecret-tools dbus-x11
          browsers() { node scripts/sign-in-e2e/node_modules/playwright/cli.js install --with-deps chromium firefox webkit; }
          browsers || { sleep 15; browsers; }

      # Packaged builds keep secrets in the OS credential store: an unlocked keyring in a session
      # bus, checked with secret-tool before the test starts.
      - name: Sign-in end to end in the packaged app
        timeout-minutes: 6
        env:
          TENUVAULT_SMOKE_APP: ${{ github.workspace }}/dist/linux-unpacked/tenuvault-desktop
          XDG_CURRENT_DESKTOP: GNOME
        run: |
          # The inner script expands in the session bus shell, not here.
          # shellcheck disable=SC2016
          dbus-run-session -- bash -euo pipefail -c '
            mkdir -p ~/.local/share/keyrings
            eval "$(printf "\n" | gnome-keyring-daemon --unlock)"
            eval "$(printf "\n" | gnome-keyring-daemon --start --components=secrets)"
            printf probe | secret-tool store --label=probe tenuvault-sign-in-e2e probe
            test "$(secret-tool lookup tenuvault-sign-in-e2e probe)" = probe
            xvfb-run -a node scripts/sign-in-e2e/run.mjs out/sign-in-e2e
          '

      - name: Undo the sign-in test's changes to the runner
        if: always()
        run: node scripts/sign-in-e2e/runner.mjs cleanup

      - name: Upload sign-in results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-in-e2e-linux
          path: out/sign-in-e2e
          if-no-files-found: ignore

  # Unsigned installers for pull requests, so contributors see that packaging still works.
  installers:
    name: Build installers (${{ matrix.name }})
    if: github.event_name != 'push' && needs.checks.outputs.package_required == 'true'
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
            app: dist/win-unpacked/TenuVault.exe
          - name: macOS
            os: macos-latest
            target: --mac
            app: dist/mac-arm64/TenuVault.app/Contents/MacOS/TenuVault
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Manually requested installers can sign in to real licensed tenants. Pull requests
      # (including forks without secrets) keep the inert placeholder key.
      - name: Select licensing configuration
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          RELEASE_PUBLIC_KEY: ${{ secrets.TENUVAULT_LICENSE_PUBLIC_KEY }}
          RELEASE_PORTAL_URL: ${{ vars.TENUVAULT_LICENSE_PORTAL_URL }}
        run: |
          if [ -z "$RELEASE_PUBLIC_KEY" ] || [ -z "$RELEASE_PORTAL_URL" ]; then
            echo "::error::Release and manual installer builds need the TENUVAULT_LICENSE_PUBLIC_KEY secret and TENUVAULT_LICENSE_PORTAL_URL variable"
            exit 1
          fi
          {
            echo "TENUVAULT_RELEASE_BUILD=1"
            echo "TENUVAULT_LICENSE_API_BASE=https://www.tenuvault.com"
            echo "TENUVAULT_LICENSE_BUY_URL=https://tenuvault.com/desktop#pricing"
            echo "TENUVAULT_LICENSE_PORTAL_URL=$RELEASE_PORTAL_URL"
            delimiter="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
            echo "TENUVAULT_LICENSE_PUBLIC_KEY<<$delimiter"
            printf '%s\n' "$RELEASE_PUBLIC_KEY"
            echo "$delimiter"
          } >> "$GITHUB_ENV"

      - name: Build installers
        if: runner.os != 'Windows' || github.event_name != 'workflow_dispatch' || !inputs.signed_windows
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-vite build
          npx electron-builder --config electron-builder.config.cjs ${{ matrix.target }} --publish never

      # Signing credentials are never made available to a pull-request build.
      - name: Build signed Windows verification installers
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.signed_windows
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_SIGNING_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_SIGNING_CLIENT_SECRET }}
          AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME }}
          AZURE_TRUSTED_SIGNING_PUBLISHER_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          set -euo pipefail
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TRUSTED_SIGNING_ENDPOINT AZURE_TRUSTED_SIGNING_ACCOUNT_NAME AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE_NAME AZURE_TRUSTED_SIGNING_PUBLISHER_NAME; do
            if [ -z "${!name:-}" ]; then echo "::error::Signed verification needs the $name signing secret"; exit 1; fi
          done
          test "$TENUVAULT_RELEASE_BUILD" = 1
          npx electron-vite build
          npx electron-builder --config electron-builder.config.cjs --win -c.forceCodeSigning=true --publish never

      - name: Verify Windows app and capture helper signatures
        if: runner.os == 'Windows' && github.event_name == 'workflow_dispatch' && inputs.signed_windows
        shell: pwsh
        env:
          EXPECTED_PUBLISHER: ${{ secrets.AZURE_TRUSTED_SIGNING_PUBLISHER_NAME }}
        run: |
          $folders = @(Get-ChildItem dist -Directory -Filter 'win*unpacked')
          if ($folders.Count -eq 0) { throw 'No packaged Windows app found.' }
          foreach ($folder in $folders) {
            ./scripts/check-capture-signatures.ps1 -AppDirectory $folder.FullName -ExpectedPublisher $env:EXPECTED_PUBLISHER
          }
          Compress-Archive -Path dist/win-unpacked/* -DestinationPath dist/TenuVault-signed-verification-x64.zip

      - name: Test Windows capture helper
        if: runner.os == 'Windows'
        run: node scripts/test-app-backup-helper.mjs

      - name: Verify packaged security fuses
        run: node scripts/check-fuses.cjs "${{ matrix.app }}"

      # The runner's real policy store: managed preferences with sudo on macOS, HKCU on Windows.
      - name: Test the smoke run's update policy harness
        timeout-minutes: 2
        run: node scripts/test-smoke-update-policy.mjs

      - name: Smoke test the packaged app
        timeout-minutes: 5
        shell: bash
        env:
          TENUVAULT_SMOKE_APP: ${{ github.workspace }}/${{ matrix.app }}
        run: npm run smoke -- out/smoke

      # The same steps as the Release workflow's: the test is checked out from the workflow's own
      # commit and installed on its own, so every pull request proves the release gate's setup.
      - name: Check out the sign-in test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: .sign-in-test
          sparse-checkout: scripts/sign-in-e2e
          persist-credentials: false

      - name: Install the sign-in test
        shell: bash
        run: |
          npm ci --prefix .sign-in-test/scripts/sign-in-e2e
          browsers() { node .sign-in-test/scripts/sign-in-e2e/node_modules/playwright/cli.js install chromium firefox webkit; }
          browsers || { sleep 15; browsers; }

      - name: Sign-in end to end in the packaged app
        timeout-minutes: 6
        shell: bash
        env:
          TENUVAULT_SMOKE_APP: ${{ github.workspace }}/${{ matrix.app }}
        run: node .sign-in-test/scripts/sign-in-e2e/run.mjs out/sign-in-e2e

      - name: Undo the sign-in test's changes to the runner
        if: always() && hashFiles('.sign-in-test/scripts/sign-in-e2e/runner.mjs') != ''
        shell: bash
        run: node .sign-in-test/scripts/sign-in-e2e/runner.mjs cleanup

      - name: Upload installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tenuvault-desktop-${{ matrix.name }}
          path: |
            dist/*.exe
            dist/*.msi
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          if-no-files-found: error

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-screenshots-${{ matrix.name }}
          path: out/smoke
          if-no-files-found: ignore

      - name: Upload sign-in results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sign-in-e2e-${{ matrix.name }}
          path: out/sign-in-e2e
          if-no-files-found: ignore

  # Preserve the required check names even when no installer build is needed.
  # These lightweight gates fail if validation or a required installer build fails.
  package:
    name: Package (${{ matrix.name }})
    if: always() && github.event_name != 'push'
    needs: [checks, installers]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        name: [Windows, macOS]
    steps:
      - name: Verify installer requirement
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          PACKAGE_REQUIRED: ${{ needs.checks.outputs.package_required }}
          INSTALLERS_RESULT: ${{ needs.installers.result }}
        run: |
          test "$CHECKS_RESULT" = success
          if [ "$PACKAGE_REQUIRED" = false ]; then
            echo "Documentation-only changes: installer build not needed." >> "$GITHUB_STEP_SUMMARY"
          else
            test "$PACKAGE_REQUIRED" = true
            test "$INSTALLERS_RESULT" = success
          fi
