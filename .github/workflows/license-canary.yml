name: Licensing canary

# The buyer path against production every 30 minutes, as a shipped app runs it: activate the
# dedicated canary key, verify the token offline with the pinned production key, refresh,
# refuse an unknown key, release (scripts/license-canary.ts). A failed run is emailed to the
# licensing inbox through the website's alerting, and GitHub emails the maintainer as well. It
# runs here, outside Vercel, so it also catches the website's own scheduled check having stopped.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: Only send a test alert email, to confirm delivery.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: license-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Activate, verify, refresh and release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      # The canary runs the app's license code with Node; it needs no Electron binary.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run the licensing canary
        env:
          LICENSING_CANARY_KEY: ${{ secrets.LICENSING_CANARY_KEY }}
          # Failures are emailed to the licensing inbox through the website's alerting.
          LICENSING_CANARY_ALERT_SECRET: ${{ secrets.LICENSING_CANARY_ALERT_SECRET }}
          CANARY_TEST_ALERT: ${{ inputs.test_alert && '1' || '' }}
        # Bundled with the locked esbuild, then run with plain Node.
        run: |
          npx esbuild scripts/license-canary.ts --bundle --platform=node --format=esm --log-level=warning --outfile="$RUNNER_TEMP/license-canary.mjs"
          node "$RUNNER_TEMP/license-canary.mjs"
