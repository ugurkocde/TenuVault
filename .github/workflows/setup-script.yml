name: Setup script

# Runs the app registration setup script end to end against a local stand-in for Microsoft,
# on the PowerShell editions and systems the Linux checks in ci.yml cannot cover.
on:
  pull_request:
    paths:
      - resources/New-TenuVaultDesktopApp.ps1
      - test/fixtures/app-registration/**
      - test/app-registration-script.test.ts
      - .github/workflows/setup-script.yml
  push:
    branches: [main]
    paths:
      - resources/New-TenuVaultDesktopApp.ps1
      - test/fixtures/app-registration/**
      - test/app-registration-script.test.ts
      - .github/workflows/setup-script.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-script-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Setup script (${{ matrix.name }})
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows PowerShell 5.1
            os: windows-latest
            powershell: powershell.exe
          - name: PowerShell 7 on Windows
            os: windows-latest
            powershell: pwsh
          - name: PowerShell 7 on macOS
            os: macos-latest
            powershell: pwsh
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run the setup script against the stand-in
        run: npx vitest run test/app-registration-script.test.ts
        env:
          TENUVAULT_TEST_POWERSHELL: ${{ matrix.powershell }}
